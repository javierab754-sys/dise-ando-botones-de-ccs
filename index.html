<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilizando Botones con CSS</title>
    <style>
        /* Estilos generales para centrar y separar los botones */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 40px;
            background-color: #f5f5f5;
        }

        /* 1. Botón "Buscar" (Bordes muy redondeados) */
        .btn-buscar {
            width: 250px;
            height: 60px;
            background-color: #c5d4ed;
            color: #2b2b2b;
            border: 2px solid #2b3a4a;
            border-radius: 30px; /* Redondea los bordes */
            font-size: 24px;
            cursor: pointer;
        }

        /* 2. Botón "+" (Forma circular perfecta) */
        .btn-mas {
            width: 70px;
            height: 70px;
            background-color: #e65c19;
            color: white;
            border: none;
            border-radius: 50%; /* Hace que sea completamente circular */
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 3. Botón "Crear cuenta" (Con sombra y color azul brillante) */
        .btn-crear {
            width: 250px;
            height: 55px;
            background-color: #00a8cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 22px;
            font-weight: bold;
            /* Sombra: eje X (0px), eje Y (4px), difuminado (12px), color con transparencia */
            box-shadow: 0px 6px 15px rgba(0, 168, 204, 0.5);
            cursor: pointer;
        }

        /* 4. Botón propio con efecto :hover (Punto 5 y 6 de la guía) */
        .btn-mi-boton {
            width: 220px;
            height: 50px;
            background-color: #2ed573;
            color: white;
            border: 2px solid #26af5f;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            /* Transición suave para los cambios en :hover */
            transition: all 0.3s ease;
        }

        /* Efecto al pasar el mouse por encima (:hover) */
        .btn-mi-boton:hover {
            background-color: #26af5f;
            transform: scale(1.05); /* Aumenta ligeramente el tamaño */
            box-shadow: 0px 8px 20px rgba(38, 175, 95, 0.4); /* Aparece una sombra */
        }
    </style>
</head>
<body>

    <!-- 1. Botón Buscar -->
    <button class="btn-buscar">Buscar</button>

    <!-- 2. Botón Circular "+" -->
    <button class="btn-mas">+</button>

    <!-- 3. Botón Crear Cuenta -->
    <button class="btn-crear">Crear cuenta</button>

    <!-- 4. Botón propio con hover (Desafío adicional) -->
    <button class="btn-mi-boton">¡Mi Botón!</button>

</body>
</html>
